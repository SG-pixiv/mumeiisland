# 업로드 프로그램 exe 를 Windows 에서 만들고, 켜서 확인한 뒤 GitHub Releases 에 올려요.
#   새 버전 내기: public/uploader/mumei-uploader.cjs 의 VERSION 을 올리고 main 에 푸시하면 끝
#                 (그 버전의 릴리스 uploader-v<VERSION> 이 아직 없으면 태그 · 릴리스를 만들어요. 있으면 확인만 해요)
#   받는 주소(항상 최신): https://github.com/<계정>/<저장소>/releases/latest/download/mumei-uploader.exe
# Actions 탭에서 "Run workflow" 로 직접 돌려도 돼요. exe 는 Artifacts 에서도 받을 수 있어요.

name: 업로드 프로그램 exe

on:
  push:
    branches: [main]
    paths:
      - 'public/uploader/**'
      - 'scripts/build-uploader.mjs'
      - 'scripts/smoke-uploader.mjs'
      - 'scripts/uploader-icon.ico'
      - 'scripts/uploader-release.md'
      - '.github/workflows/uploader.yml'
  workflow_dispatch:

concurrency:
  group: uploader-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 테스트
        run: npm test

      - name: exe 만들기
        run: npm run build:uploader

      - name: 켜 보기 (버전 · 설정 없을 때)
        shell: pwsh
        run: |
          $v = (& .\dist-uploader\mumei-uploader.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "exe 가 켜지지 않았어요 (종료 코드 $LASTEXITCODE)" }
          Write-Host "exe 버전: $v"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "버전 형식이 이상해요: $v" }
          $env:MUMEI_NO_PROMPT = '1'
          & .\dist-uploader\mumei-uploader.exe
          if ($LASTEXITCODE -ne 1) { throw "설정이 없을 때 안내하고 끝나야 해요 (종료 코드 $LASTEXITCODE)" }
          "UPLOADER_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: 업로드 해 보기 (가짜 서버)
        run: node scripts/smoke-uploader.mjs dist-uploader/mumei-uploader.exe

      - uses: actions/upload-artifact@v4
        with:
          name: mumei-uploader-${{ env.UPLOADER_VERSION }}
          path: |
            dist-uploader/mumei-uploader.exe
            dist-uploader/NODE-LICENSE.txt

      - name: 릴리스에 올리기 (새 버전일 때만)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "uploader-v$env:UPLOADER_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag 릴리스가 이미 있어요. 새로 내려면 mumei-uploader.cjs 의 VERSION 을 올려 주세요."
            exit 0
          }
          gh release create $tag `
            dist-uploader/mumei-uploader.exe dist-uploader/NODE-LICENSE.txt `
            --target $env:GITHUB_SHA `
            --title "무명섬 업로드 프로그램 v$env:UPLOADER_VERSION" `
            --notes-file scripts/uploader-release.md `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "릴리스를 만들지 못했어요" }
