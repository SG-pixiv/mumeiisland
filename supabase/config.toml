# Supabase CLI 설정 (함수 배포용 최소 설정)
project_id = "mumeiisland"

[functions.er-sync]
# 권한 확인은 함수 안에서 직접 해요 (관리자 로그인 토큰 또는 CRON_SECRET)
verify_jwt = false

